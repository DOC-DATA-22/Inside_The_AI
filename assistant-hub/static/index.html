<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Assistant · Inside the AI</title>
<style>
  :root {
    --bg: #0d1017; --panel: #161b24; --line: #232c3a; --text: #e6ebf2;
    --muted: #8a95a6; --accent: #00e0a4; --user: #1f2937; --bot: #12313f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  header .dot { width: 10px; height: 10px; border-radius: 99px; background: var(--accent); }
  header h1 { font-size: 15px; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; margin-left: auto; }
  #chat { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; max-width: 780px; width: 100%; margin: 0 auto; }
  .msg { padding: 12px 16px; border-radius: 14px; max-width: 80%; line-height: 1.5; font-size: 14.5px; white-space: pre-wrap; }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.bot.thinking { color: var(--muted); font-style: italic; }
  form { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; max-width: 780px; width: 100%; margin: 0 auto; }
  input { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { background: var(--accent); color: #062018; border: none; border-radius: 12px; padding: 0 20px; font-weight: 600; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>My Assistant</h1>
    <span>Inside the AI · Series 1</span>
  </header>

  <div id="chat">
    <div class="msg bot">Hey — I'm your assistant. Ask me anything. (Next week I'll be wired to your research agent.)</div>
  </div>

  <form id="form">
    <input id="input" placeholder="Type a message…" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  function addMsg(text, who, thinking) {
    const div = document.createElement('div');
    div.className = 'msg ' + who + (thinking ? ' thinking' : '');
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addMsg(message, 'user');
    input.value = '';
    send.disabled = true;
    const thinking = addMsg('thinking…', 'bot', true);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      thinking.remove();
      addMsg(data.reply || '(no reply)', 'bot');
    } catch (err) {
      thinking.remove();
      addMsg('Connection error — is the server running?', 'bot');
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
